name: ftn-check
# FTN (ftn/) tests + handoff.v1 contract + monorepo fixture E2E
# (FTN brief → contract → MINT scan → MINT ftn_context reader → desk adapter acceptance).
on:
  push:
    branches: [main]
    paths:
      - "ftn/**"
      - "trading/src/mint/dispatch/**"
      - "desk/js/adapters/dayContext.js"
      - "desk/tests/**"
      - "scripts/e2e_fixtures.sh"
      - ".github/workflows/ftn-check.yml"
  pull_request:
    paths:
      - "ftn/**"
      - "trading/src/mint/dispatch/**"
      - "desk/js/adapters/dayContext.js"
      - "desk/tests/**"
      - "scripts/e2e_fixtures.sh"
      - ".github/workflows/ftn-check.yml"
  workflow_dispatch:
jobs:
  ftn:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install test deps (FTN core is stdlib-only)
        run: python3 -m pip install --quiet pytest jsonschema
      - name: pytest (ftn/) — incl. handoff.v1 contract + ban tests
        working-directory: ftn
        # FTN tests persist session/swing tickets in dispatch/out/ and are not
        # idempotent across runs; CI always starts clean.
        run: |
          rm -f dispatch/out/*.json
          python3 -m pytest -q -p no:cacheprovider
      - name: Validate committed handoff.v1 samples
        working-directory: ftn
        run: PYTHONPATH=src python3 -m ftn.os.handoff_contract dispatch/samples/handoff_v1_*.json
      - name: Monorepo fixture E2E (scripts/e2e_fixtures.sh)
        run: |
          bash scripts/e2e_fixtures.sh | tee e2e_output.txt
          echo '```' >> "$GITHUB_STEP_SUMMARY"; cat e2e_output.txt >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: ftn-handoff-latest
          path: |
            ftn/dispatch/out/handoff_latest.json
            trading/dispatch/out/ftn_context_latest.json
