name: desk-check
# HERMES Desk (desk/) is vanilla HTML/CSS/ES modules — no build step.
# Syntax-check every JS module and verify index.html references resolve.
on:
  push:
    branches: [main]
    paths:
      - "desk/**"
      - "ftn/dispatch/samples/**"
      - ".github/workflows/desk-check.yml"
  pull_request:
    paths:
      - "desk/**"
      - "ftn/dispatch/samples/**"
      - ".github/workflows/desk-check.yml"
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: node --check all ES modules
        run: |
          set -e
          for f in $(find js -name '*.js'); do
            node --input-type=module --check < "$f" && echo "ok $f"
          done
      - name: index.html local refs exist
        run: |
          set -e
          grep -oE '(src|href)="[^"#:]+"' index.html | sed -E 's/.*="([^"]+)"/\1/' | while read -r ref; do
            test -e "$ref" || { echo "missing: $ref"; exit 1; }
            echo "ok $ref"
          done
      - name: FTN DayContext adapter acceptance (I1 — no desk-side derivation)
        run: node tests/dayContext.test.mjs
