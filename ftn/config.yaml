# FTN standalone agent config
# PAPER default. Live locked unless human unlocks.

layer:
  id: FTN
  title: Filling The Numbers orchestration agent
  mint_sibling: https://github.com/GdotAiM/mint-agent

mode: paper
live_enabled: false
live_data_enabled: false
# Trading live: live_enabled + FTN_LIVE=1 (still refused by stub).
# Data live: live_data_enabled + FTN_LIVE_DATA=1 (quotes only, no orders).

symbol_default: EURUSD
timezone: America/New_York

equity:
  starting_usd: 100000
  currency: USD

risk_caps:
  max_trade_risk_pct: 0.5
  max_daily_loss_pct: 2.0
  max_portfolio_dd_pct: 5.0
  scale_out_after_levels: 4
  runner_pct: 0.25
  raise_requires: human

volatility:
  min_atr_pips: 20
  compress_blocks_trade: true

sessions:
  asian: { start: "19:00", end: "00:00" }   # NY clock previous evening
  london: { start: "02:00", end: "05:00" }
  ny_am: { start: "07:00", end: "10:00" }
  flout: { start: "15:00", end: "00:00" }
  cbdr: { start: "14:00", end: "20:00" }    # ICT CBDR window (NY)

killzones:
  - london
  - ny_am

measurement_families:
  - pivots
  - cbdr
  - asian
  - flout

confluence:
  require_pd_overlap: true
  overlap_tolerance_pips: 8

# Model 13 (Charter bridge to the 2022 YouTube model, kNlySn81dmo).
# Annotation only — never a PAM, candidate, session_ticket or paper_swing.
# Off by default for the legacy `ftn run` payload; `ftn brief` always reads an
# explicit model13_bridge label when a fixture provides one.
model13_bridge_enabled: false

# Interpretation entry triggers for CONSO / BB / PIP20 (REPORT D15). The Month 9 docs give
# eligibility for these models but NO sourced execution trigger (only REV's LTF MSS exists,
# itself hermes_interpretation). With a flag on, the arbiter may SELECT that model when its
# labelled hermes_interpretation trigger fires (REV still preempts). OFF by default; turning
# one on is a research decision, not a trading one — the MINT allowlist still gates drafts.
interpretation_triggers:
  conso: false   # fade_edge + a later 15m close back inside the box
  bb: false      # engine=offset + LTF MSS after the raid
  pip20: false   # eligible + displacement after the raid

# MINT allowlist for M9 entry models (mirrors HERMES trading/ALLOWLIST.md).
# Gate 4 of the FTN research-draft chain. Passing it is necessary but NOT sufficient:
# gate 6 (contract, HERMES_INTEGRATION_I0) keeps actionable_for_mint false regardless.
# Entry requires ONE of:
#   Path A: { id: REV, kind: survives, board_ref: "research/summaries/<...>_BOARD_LOCK.md" }
#   Path B: { id: REV, kind: paper_pilot, stamp: "<path to human paper-pilot stamp>",
#             expires: "YYYY-MM-DD", kill: "<kill criteria>" }
# The stamp/board_ref file must exist (path relative to this repo). Only a human adds entries.
# Today: EMPTY — HERMES Wave 1 has zero SURVIVES and no human paper-pilot stamp exists.
mint_allowlist: []

journal:
  template: src/ftn/journal/_TEMPLATE_DECISION.md

banned:
  - live_without_dual_unlock
  - treat_pivots_as_entries
  - order_without_pd_array
  - trade_compressed_range
  - raise_caps_without_human
  - commit_secrets
