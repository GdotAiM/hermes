name: sync-lab-mirror
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "AGENT.md"
      - "ALLOWLIST.md"
      - "config.yaml"
      - "src/mint/**"
      - "SYNC.md"
      - "scripts/sync_to_hermes_x.sh"
      - ".github/workflows/sync-lab-mirror.yml"
permissions:
  contents: read
jobs:
  sync-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mint-agent (SoT)
        uses: actions/checkout@v4
        with:
          path: mint-agent

      - name: Require HERMES_X_SYNC_TOKEN
        env:
          HERMES_X_SYNC_TOKEN: ${{ secrets.HERMES_X_SYNC_TOKEN }}
        run: |
          if [ -z "$HERMES_X_SYNC_TOKEN" ]; then
            echo "::error::HERMES_X_SYNC_TOKEN secret is missing."
            echo "Add a classic PAT (repo scope) as repo secret HERMES_X_SYNC_TOKEN so this Action can open PRs on GdotAiM/hermes-x."
            echo "Until then, sync locally: ./scripts/sync_to_hermes_x.sh /path/to/hermes-x"
            exit 1
          fi

      - name: Checkout hermes-x
        uses: actions/checkout@v4
        with:
          repository: GdotAiM/hermes-x
          token: ${{ secrets.HERMES_X_SYNC_TOKEN }}
          path: hermes-x

      - name: Run sync script
        run: |
          chmod +x mint-agent/scripts/sync_to_hermes_x.sh
          mint-agent/scripts/sync_to_hermes_x.sh "$GITHUB_WORKSPACE/hermes-x"
          mint-agent/scripts/check_drift.sh "$GITHUB_WORKSPACE/hermes-x"

      - name: Open PR on hermes-x if trading/ changed
        working-directory: hermes-x
        env:
          GH_TOKEN: ${{ secrets.HERMES_X_SYNC_TOKEN }}
        run: |
          git config user.name "mint-agent-sync"
          git config user.email "mint-agent-sync@users.noreply.github.com"
          if git diff --quiet && git diff --cached --quiet; then
            # also check untracked
            if [ -z "$(git status --porcelain trading)" ]; then
              echo "No hermes-x/trading changes — nothing to PR"
              exit 0
            fi
          fi
          BRANCH="sync/mint-agent-${GITHUB_SHA::7}"
          git checkout -b "$BRANCH"
          git add trading/
          git commit -m "Sync trading/ mirror from mint-agent@${GITHUB_SHA::7}"
          git push -u origin "$BRANCH"
          gh pr create -R GdotAiM/hermes-x \
            --title "Sync trading/ from mint-agent@${GITHUB_SHA::7}" \
            --body "Automated mirror sync. **SoT:** https://github.com/GdotAiM/mint-agent/commit/${GITHUB_SHA}

          See mint-agent SYNC.md. Do not hand-edit trading/." \
            --base main \
            --head "$BRANCH" || echo "PR may already exist"
